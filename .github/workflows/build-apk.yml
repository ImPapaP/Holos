name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project shell (first build only)
        run: |
          if [ ! -d android ]; then
            flutter create --org ph.edu.bulsu --project-name gabay --platforms android .
            rm -rf test
          fi

      - name: Add permissions and set minSdk 24
        run: python3 .github/scripts/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk gabay.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gabay-apk
          path: gabay.apk

      - name: Publish download on Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gabay build ${{ github.run_number }}
          body: |
            Download **gabay.apk** below and open it on an Android phone (Android 7 or newer).
            Allow "Install unknown apps" when asked.
          files: gabay.apk
