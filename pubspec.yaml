name: gabay
description: Gabay - a universal sensory substitution app for persons with sensory disabilities.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  google_mlkit_object_detection: ^0.13.0
  vibration: ^3.2.1
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  noise_meter: ^5.0.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  flutter_blue_plus: ^1.32.12
  sensors_plus: ^6.0.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
